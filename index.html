<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Red Panda · Próximamente</title>
  <meta name="description" content="Red Panda Bubble Tea — muy pronto en el CC Ciudad Tunal, Bogotá. Síguenos en Instagram @redpanda.tea">
  <meta name="theme-color" content="#ED220F">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --rojo: #ED220F;
      --rojo-oscuro: #C91A09;
      --blanco: #FFFFFF;
      --rebote: cubic-bezier(.34, 1.56, .64, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      background:
        radial-gradient(ellipse 70% 55% at 50% 38%, #F5402E 0%, transparent 70%),
        var(--rojo);
      color: var(--blanco);
      font-family: "Fredoka", system-ui, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      position: relative;
    }

    /* ---------- Entrada escalonada al cargar ---------- */
    .entra {
      opacity: 0;
      animation: entrar .8s var(--rebote) forwards;
      animation-delay: calc(var(--i, 0) * 120ms + 100ms);
    }
    @keyframes entrar {
      /* usa translate/scale (no transform) para no bloquear los efectos hover */
      from { opacity: 0; translate: 0 26px; scale: .96; }
      to   { opacity: 1; translate: 0 0; scale: 1; }
    }

    /* ---------- Perlas de boba flotando ---------- */
    .burbujas { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    /* tapiocas blancas semitransparentes que suben girando */
    .burbujas img {
      position: absolute;
      bottom: -140px;
      height: auto;
      opacity: 0;
      animation: subir linear infinite;
    }
    .burbujas img:nth-child(1)  { left: 3%;  width: 70px;  animation-duration: 19s; animation-delay: -2s; }
    .burbujas img:nth-child(2)  { left: 13%; width: 42px;  animation-duration: 14s; animation-delay: -9s; }
    .burbujas img:nth-child(3)  { left: 22%; width: 96px;  animation-duration: 24s; animation-delay: -15s; }
    .burbujas img:nth-child(4)  { left: 33%; width: 50px;  animation-duration: 16s; animation-delay: -5s; }
    .burbujas img:nth-child(5)  { left: 45%; width: 36px;  animation-duration: 13s; animation-delay: -11s; }
    .burbujas img:nth-child(6)  { left: 55%; width: 78px;  animation-duration: 21s; animation-delay: -1s; }
    .burbujas img:nth-child(7)  { left: 66%; width: 46px;  animation-duration: 15s; animation-delay: -7s; }
    .burbujas img:nth-child(8)  { left: 75%; width: 104px; animation-duration: 26s; animation-delay: -18s; }
    .burbujas img:nth-child(9)  { left: 86%; width: 58px;  animation-duration: 17s; animation-delay: -4s; }
    .burbujas img:nth-child(10) { left: 93%; width: 40px;  animation-duration: 14s; animation-delay: -12s; }
    .burbujas img:nth-child(11) { left: 39%; width: 64px;  animation-duration: 22s; animation-delay: -20s; }
    .burbujas img:nth-child(12) { left: 8%;  width: 54px;  animation-duration: 18s; animation-delay: -13s; }
    .burbujas img:nth-child(even) { animation-name: subir-izq; }
    @keyframes subir {
      0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      10%  { opacity: .15; }
      50%  { transform: translate(24px, -60vh) rotate(160deg); }
      90%  { opacity: .15; }
      100% { transform: translate(-12px, -125vh) rotate(320deg); opacity: 0; }
    }
    @keyframes subir-izq {
      0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      10%  { opacity: .12; }
      50%  { transform: translate(-22px, -60vh) rotate(-140deg); }
      90%  { opacity: .12; }
      100% { transform: translate(14px, -125vh) rotate(-290deg); opacity: 0; }
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 16px 100px;
    }

    /* ---------- Etiqueta ---------- */
    .etiqueta {
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .28em;
      text-transform: uppercase;
      padding: 7px 16px 7px 19px;
      border: 2px solid rgba(255, 255, 255, .55);
      border-radius: 999px;
      margin-bottom: clamp(28px, 6vh, 44px);
      transition: background .25s, color .25s, border-color .25s, transform .35s var(--rebote);
      cursor: default;
    }
    .etiqueta:hover {
      background: var(--blanco);
      color: var(--rojo);
      border-color: var(--blanco);
      transform: scale(1.08) rotate(-2deg);
    }

    /* ---------- Logo ---------- */
    .logo-wrap {
      width: min(560px, 88vw);
      animation: flotar 4.5s ease-in-out infinite;
    }
    .logo {
      display: block;
      width: 100%;
      height: auto;
      transition: transform .45s var(--rebote), filter .3s;
      cursor: default;
    }
    .logo-wrap:hover .logo {
      transform: scale(1.06) rotate(-1.5deg);
      filter: drop-shadow(0 8px 0 rgba(150, 15, 5, .35));
      animation: menear .6s ease-in-out .1s;
    }
    @keyframes flotar {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }
    @keyframes menear {
      0%, 100% { rotate: 0deg; }
      25%      { rotate: -2.5deg; }
      50%      { rotate: 2deg; }
      75%      { rotate: -1deg; }
    }

    /* ---------- Perlas separadoras ---------- */
    .perlas {
      display: flex;
      gap: 10px;
      margin: clamp(30px, 6vh, 46px) 0 20px;
      padding: 6px;
      cursor: default;
    }
    .perlas i {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--blanco);
      opacity: .9;
      animation: rebote 1.6s ease-in-out infinite;
      transition: transform .3s var(--rebote), opacity .3s;
    }
    .perlas i:nth-child(2) { animation-delay: .2s; opacity: .7; }
    .perlas i:nth-child(3) { animation-delay: .4s; opacity: .5; }
    .perlas:hover i { animation-duration: .5s; opacity: 1; }
    @keyframes rebote {
      0%, 100% { transform: translateY(0); }
      40%      { transform: translateY(-7px); }
    }

    /* ---------- Título con letras que saltan ---------- */
    h1 {
      font-weight: 700;
      font-size: clamp(2.3rem, 8.5vw, 4.6rem);
      letter-spacing: .06em;
      line-height: 1;
      text-shadow: 0 4px 0 var(--rojo-oscuro);
      cursor: default;
      white-space: nowrap;
    }
    h1 span {
      display: inline-block;
      transition: transform .35s var(--rebote), text-shadow .35s;
    }
    h1 span:hover {
      transform: translateY(-12px) rotate(-6deg) scale(1.12);
      text-shadow: 0 14px 0 var(--rojo-oscuro);
    }
    h1:hover span { animation: ola .9s ease-in-out; animation-delay: calc(var(--l) * 45ms); }
    @keyframes ola {
      0%, 100% { translate: 0 0; }
      40%      { translate: 0 -8px; }
    }

    .sub {
      margin-top: 14px;
      font-weight: 500;
      font-size: clamp(1.05rem, 3.4vw, 1.35rem);
      opacity: .9;
    }

    /* ---------- Tarjeta de la isla ---------- */
    .isla {
      margin-top: clamp(86px, 12vh, 100px);
      width: min(460px, 100%);
    }
    .isla-tarjeta {
      position: relative;
      transform: rotate(-1.2deg);
      transition: transform .45s var(--rebote);
      cursor: default;
    }
    .isla-caja {
      background: var(--blanco);
      color: var(--rojo);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 10px 0 var(--rojo-oscuro), 0 18px 40px rgba(110, 10, 0, .28);
      transition: box-shadow .45s var(--rebote);
    }
    .isla-tarjeta:hover { transform: rotate(0deg) translateY(-6px) scale(1.03); }
    .isla-tarjeta:hover .isla-caja {
      box-shadow: 0 16px 0 var(--rojo-oscuro), 0 28px 50px rgba(110, 10, 0, .35);
    }

    /* Panda echado encima de la tarjeta */
    .panda-sofa {
      position: absolute;
      right: 12px;
      bottom: calc(100% - 12px);
      width: 100px;
      height: auto;
      transform-origin: 50% 100%;
      transition: transform .45s var(--rebote);
      filter: drop-shadow(0 4px 0 rgba(150, 15, 5, .35));
    }
    .isla-tarjeta:hover .panda-sofa { transform: translateY(-6px) rotate(-5deg) scale(1.08); }
    .cinta {
      height: 16px;
      background: repeating-linear-gradient(
        -45deg,
        var(--rojo) 0 14px,
        var(--blanco) 14px 28px
      );
      background-size: 39.6px 16px;
      border-bottom: 2px solid var(--rojo);
    }
    .isla-tarjeta:hover .cinta { animation: avanzar .8s linear infinite; }
    @keyframes avanzar { to { background-position: 39.6px 0; } }

    .isla-cuerpo {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 22px 20px;
      text-align: left;
    }
    .pin {
      flex: none;
      width: 52px; height: 52px;
      border-radius: 50%;
      background: var(--rojo);
      display: grid;
      place-items: center;
    }
    .pin svg { width: 26px; height: 26px; }
    .isla-tarjeta:hover .pin svg { animation: saltar .7s var(--rebote) infinite alternate; }
    @keyframes saltar {
      from { transform: translateY(2px); }
      to   { transform: translateY(-5px); }
    }
    .isla-texto small {
      display: block;
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      opacity: .75;
    }
    .isla-texto strong {
      display: block;
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.25;
      margin-top: 3px;
    }
    .isla-texto span {
      display: block;
      font-size: .95rem;
      margin-top: 3px;
      color: #8A2A20;
    }

    /* ---------- Botón de Instagram ---------- */
    .insta {
      margin-top: clamp(30px, 5vh, 40px);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 22px 12px 14px;
      border-radius: 999px;
      border: 2px solid var(--blanco);
      color: var(--blanco);
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
      transition: background .25s, color .25s, transform .35s var(--rebote), box-shadow .35s var(--rebote);
    }
    .insta svg {
      width: 26px; height: 26px;
      transition: transform .45s var(--rebote);
    }
    .insta:hover, .insta:focus-visible {
      background: var(--blanco);
      color: var(--rojo);
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 6px 0 var(--rojo-oscuro);
      outline: none;
    }
    .insta:hover svg, .insta:focus-visible svg { transform: rotate(-12deg) scale(1.15); }
    .insta:active { transform: translateY(0) scale(.98); box-shadow: 0 2px 0 var(--rojo-oscuro); }

    /* ---------- Panda que se asoma en la esquina ---------- */
    .panda-esquina {
      position: fixed;
      right: clamp(8px, 3vw, 48px);
      bottom: 0;
      width: clamp(120px, 17vw, 230px);
      z-index: 2;
      transform: translateY(100%);
      animation: asomarse 1s var(--rebote) 1.4s forwards;
    }
    .panda-mueve {
      position: relative;
      transform-origin: 50% 100%;
      transition: transform .5s var(--rebote);
    }
    .panda-esquina img {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 -2px 12px rgba(110, 10, 0, .25));
    }
    @keyframes asomarse {
      to { transform: translateY(42%); }
    }
    .panda-esquina:hover .panda-mueve { transform: translateY(-34%) rotate(-4deg); }
    .globo {
      position: absolute;
      right: 82%;
      top: 4%;
      background: var(--blanco);
      color: var(--rojo);
      font-weight: 600;
      font-size: clamp(.8rem, 1.2vw, .95rem);
      white-space: nowrap;
      padding: 8px 14px;
      border-radius: 16px 16px 4px 16px;
      box-shadow: 0 4px 0 var(--rojo-oscuro);
      opacity: 0;
      transform: translateY(10px) scale(.7);
      transform-origin: 100% 100%;
      transition: opacity .25s, transform .4s var(--rebote);
      pointer-events: none;
    }
    .panda-esquina:hover .globo {
      opacity: 1;
      transform: translateY(0) scale(1);
      transition-delay: .15s;
    }

    footer {
      position: absolute;
      bottom: 20px;
      left: 0; right: 0;
      text-align: center;
      font-size: .85rem;
      opacity: .65;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .entra { opacity: 1; }
      .burbujas { display: none; }
      .panda-esquina { transform: translateY(42%); }
    }
  </style>
</head>
<body>
  <div class="burbujas" aria-hidden="true">
    <img src="img/tapioca-1.png" alt="">
    <img src="img/tapioca-2.png" alt="">
    <img src="img/tapioca-3.png" alt="">
    <img src="img/tapioca-4.png" alt="">
    <img src="img/tapioca-5.png" alt="">
    <img src="img/tapioca-1.png" alt="">
    <img src="img/tapioca-2.png" alt="">
    <img src="img/tapioca-3.png" alt="">
    <img src="img/tapioca-4.png" alt="">
    <img src="img/tapioca-5.png" alt="">
    <img src="img/tapioca-1.png" alt="">
    <img src="img/tapioca-2.png" alt="">
  </div>

  <main>
    <div class="etiqueta entra" style="--i:0">Bubble Tea</div>

    <div class="entra" style="--i:1">
      <div class="logo-wrap">
        <img class="logo" src="logo-white.png" alt="Red Panda" width="1100" height="236">
      </div>
    </div>

    <div class="perlas entra" style="--i:2" aria-hidden="true"><i></i><i></i><i></i></div>

    <h1 class="entra" style="--i:3" aria-label="Próximamente"><span style="--l:0" aria-hidden="true">P</span><span style="--l:1" aria-hidden="true">R</span><span style="--l:2" aria-hidden="true">Ó</span><span style="--l:3" aria-hidden="true">X</span><span style="--l:4" aria-hidden="true">I</span><span style="--l:5" aria-hidden="true">M</span><span style="--l:6" aria-hidden="true">A</span><span style="--l:7" aria-hidden="true">M</span><span style="--l:8" aria-hidden="true">E</span><span style="--l:9" aria-hidden="true">N</span><span style="--l:10" aria-hidden="true">T</span><span style="--l:11" aria-hidden="true">E</span></h1>
    <p class="sub entra" style="--i:4">Estamos preparando algo delicioso.</p>

    <section class="isla entra" style="--i:5">
      <div class="isla-tarjeta">
        <img class="panda-sofa" src="img/panda-acostado.png" alt="" width="700" height="629">
        <div class="isla-caja">
        <div class="cinta" aria-hidden="true"></div>
        <div class="isla-cuerpo">
          <div class="pin" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/>
              <circle cx="12" cy="9.5" r="2.6"/>
            </svg>
          </div>
          <div class="isla-texto">
            <small>En construcción</small>
            <strong>Nuestra isla en el CC Ciudad Tunal</strong>
            <span>Bogotá · ¡Muy pronto abrimos!</span>
          </div>
        </div>
        </div>
      </div>
    </section>

    <a class="insta entra" style="--i:6" href="https://www.instagram.com/redpanda.tea/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
      </svg>
      @redpanda.tea
    </a>
  </main>

  <div class="panda-esquina" aria-hidden="true">
    <div class="panda-mueve">
      <span class="globo">¡Ya casi abrimos!</span>
      <img src="img/panda-saluda.png" alt="" width="623" height="700">
    </div>
  </div>

  <footer>© 2026 Red Panda</footer>
</body>
</html>
